<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoToAudio — Конвертер video в аудио</title>
    <!-- Подключаем современный шрифт Inter -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 1. ВОЗВРАЩАЕМ ЛУСИД: Скрипт иконок ОБЯЗАТЕЛЬНО должен быть тут! -->
    <script src="https://unpkg.com"></script>
    
    <style>
        :root {
            --bg-color: #060913;
            --text-color: #ffffff;
            --text-muted: #707b93;
            --primary: #00a8ff;
            --primary-hover: #0096e6;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Задний фон по вашему макету (затемненный арт с Годжо Сатору) */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(200deg, rgba(6, 9, 19, 0.2) 0%, rgba(6, 9, 19, 0.95) 100%),
                url('photo.png') no-repeat center center/cover;
            z-index: -1;
        }

        /* Хедер */
        header {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: -0.02em;
        }

        .logo i, .logo span {
            color: var(--primary);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        nav ul li {
            color: var(--text-muted);
            position: relative;
            cursor: pointer;
        }

        nav ul li.active {
            color: var(--text-color);
        }

        /* Точки-разделители */
        nav ul li:not(:last-child)::after {
            content: '•';
            position: absolute;
            right: -1.4rem;
            color: rgba(255, 255, 255, 0.15);
        }

        /* Главная секция */
        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        h1 {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 1.5rem;
            letter-spacing: -0.03em;
        }

        h1 span {
            color: var(--primary);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 550px;
            margin-bottom: 3.5rem;
            line-height: 1.6;
            font-weight: 400;
        }

        /* Инпут и кнопка (Контейнер формы) */
        .converter-container {
            width: 100%;
            max-width: 760px;
            background: rgba(10, 15, 30, 0.4);
            border: 1px solid var(--card-border);
            padding: 0.4rem;
            border-radius: 16px;
            display: flex;
            align-items: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7);
            margin-bottom: 5rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .converter-container:focus-within {
            border-color: rgba(0, 168, 255, 0.4);
            box-shadow: 0 24px 64px rgba(0, 168, 255, 0.1);
        }

        .input-field {
            display: flex;
            align-items: center;
            padding-left: 1.2rem;
            flex: 1;
            color: var(--text-muted);
        }

        .converter-container input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            padding: 1.1rem;
            font-size: 1.05rem;
            font-family: inherit;
        }

        .converter-container input::placeholder {
            color: #404b61;
        }

        .submit-btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            outline: none;
            padding: 1.1rem 2.2rem;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            background: #172033;
            color: #4b566d;
            cursor: not-allowed;
        }

        /* Сетка преимуществ */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3rem;
            width: 100%;
            max-width: 800px;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .feature-icon {
            color: var(--primary);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feature-item h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .feature-item p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Анимация спиннера загрузки */
        .spinner {
            animation: rotate 1s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Адаптация под мобильные устройства */
        @media (max-width: 768px) {
            h1 { font-size: 2.3rem; }
            .subtitle { font-size: 1rem; margin-bottom: 2.5rem; }
            .converter-container { flex-direction: column; border-radius: 20px; padding: 0.8rem; gap: 0.8rem; }
            .input-field { padding-left: 0; width: 100%; }
            .submit-btn { width: 100%; justify-content: center; padding: 1.2rem; }
            .features-grid { grid-template-columns: 1fr; gap: 2rem; }
            nav { display: none; }
            header { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i data-lucide="audio-lines"></i>
            Video<span>ToAudio</span>
        </div>
        <nav>
            <ul>
                <li class="active">Быстро</li>
                <li>Удобно</li>
                <li>Бесплатно</li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Конвертируй видео<br><span>в аудио</span> по ссылке</h1>
        <p class="subtitle">Просто вставьте ссылку на видео — и получите чистый аудиофайл.</p>

        <!-- Наша форма с правильным селектором класса -->
        <form class="converter-container">
            <div class="input-field">
                <i data-lucide="link-2"></i>
                <input type="url" placeholder="Вставьте ссылку на видео (YouTube, VK и др.)" required autocomplete="off">
            </div>
            <button type="submit" class="submit-btn">
                <i></i>
                <span>Конвертировать</span>
            </button>
        </form>

        <section class="features-grid">
            <div class="feature-item">
                <div class="feature-icon"><i data-lucide="zap" size="24"></i></div>
                <h3>Быстро</h3>
                <p>Конвертация за считанные секунды</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon"><i data-lucide="shield" size="24"></i></div>
                <h3>Безопасно</h3>
                <p>Ссылки не сохраняются на сервере</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon"><i data-lucide="smartphone" size="24"></i></div>
                <h3>Удобно</h3>
                <p>Работает на любом устройстве</p>
            </div>
        </section>
    </main>

    <!--2. ИСПРАВЛЕНО: Подключаем ваш file.js в самом низу, прямо перед закрывающим </body> -->
    <script src="file.js?v=2"></script>

</body>
</html>
